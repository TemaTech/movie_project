name: Publish static movie ranking

on:
  workflow_dispatch:
  schedule:
    # 4 times daily at 3:00, 9:00, 15:00, 21:00 JST. GitHub may delay scheduled workflows during busy periods.
    - cron: '0 0,6,12,18 * * *'

permissions:
  contents: write
  packages: read

concurrency:
  group: publish-static-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: movie_ranking
          MYSQL_USER: movie_user
          MYSQL_PASSWORD: movie_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://mubiran.com
      APP_TIMEZONE: Asia/Tokyo
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: movie_ranking
      DB_USERNAME: movie_user
      DB_PASSWORD: movie_password
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore TMDb detail cache
        uses: actions/cache@v4
        with:
          path: storage/app/static-details
          key: static-details-${{ runner.os }}-v1
          restore-keys: static-details-${{ runner.os }}-v1

      - name: Restore poster image cache
        uses: actions/cache@v4
        with:
          path: storage/app/public/posters
          key: posters-${{ runner.os }}-v1
          restore-keys: posters-${{ runner.os }}-v1

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Restore vendor cache
        uses: actions/cache@v4
        id: vendor-cache
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_MAX_PARALLEL_HTTP: 4
          COMPOSER_IPRESOLVE: 4
        run: |
          composer config -g --auth http-basic.github.com x-access-token "${GITHUB_TOKEN}"
          for attempt in 1 2 3 4 5; do
            if composer install --no-interaction --prefer-dist --no-progress --no-dev; then
              exit 0
            fi
            echo "composer install failed (attempt ${attempt}), retrying in 45s..."
            sleep 45
          done
          echo "prefer-dist failed after retries, trying prefer-source..."
          composer install --no-interaction --prefer-source --no-progress --no-dev

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build

      - name: Configure Laravel
        run: |
          cp .env.example .env
          # CI must persist observations to data/history. Do not inherit a local-only path.
          sed -i '/^BOX_OFFICE_HISTORY_PATH=/d' .env
          php artisan key:generate --force
          php artisan migrate --force
          if grep -q '^BOX_OFFICE_HISTORY_PATH=' .env; then
            echo "BOX_OFFICE_HISTORY_PATH must not be set in CI" >&2
            exit 1
          fi

      - name: Fetch ranking data
        run: |
          php artisan movies:fetch-japanese-boxoffice
          php artisan movies:fetch-global-boxoffice

      - name: Persist box office history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No box office history changes"
          else
            git commit -m "chore: record box office observations"
            git push
          fi

      - name: Export static site
        run: php artisan site:export-static

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=movie-ranking --branch=main
