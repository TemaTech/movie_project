name: Publish static movie ranking

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:17 JST. GitHub may delay scheduled workflows during busy periods.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: publish-static-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: movie_ranking
          MYSQL_USER: movie_user
          MYSQL_PASSWORD: movie_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://movie-ranking.pages.dev
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: movie_ranking
      DB_USERNAME: movie_user
      DB_PASSWORD: movie_password
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Configure Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Fetch ranking data
        run: |
          php artisan movies:fetch-japanese-boxoffice
          php artisan movies:fetch-global-boxoffice

      - name: Export static site
        run: php artisan site:export-static

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=movie-ranking --branch=main
