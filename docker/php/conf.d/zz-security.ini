; PHP公式アドバイザリ（2026-10-21）に沿った起動時設定。
; このアプリにファイルアップロード機能はない。
; ini_set() と .user.ini はリクエスト解析の後に適用されるため、ここには書かない。

; CVE-2026-109619: セッションのアップロード進捗が、初期化前に古い内部状態を参照する経路を止める。
session.upload_progress.enabled = 0

; CVE-2026-109618: メモリ上限へ達しやすい巨大なPOSTを受け取らない。
post_max_size = 8M
upload_max_filesize = 2M
