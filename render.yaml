services:
  - type: web
    name: movie-ranking-app
    env: php
    buildCommand: composer install && php artisan key:generate
    startCommand: php artisan serve
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - fromGroup: movie-db-settings 